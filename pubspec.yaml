name: app_contador_maye
description: "Amatista: app de fitness estilo anime con huella, rostro, sensores, GPS y mapa. Proyecto Parcial 3, UPFIM."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Estado
  provider: ^6.1.2

  # Persistencia local (historial y perfil)
  sqflite: ^2.4.1
  path: ^1.9.0

  # Seguridad (huella + rostro y contraseña con hash)
  local_auth: ^2.3.0
  local_auth_android: ^1.0.56
  crypto: ^3.0.6

  # Reconocimiento facial propio (cámara frontal + ML Kit en el teléfono)
  camera: ^0.12.0
  google_mlkit_face_detection: ^1.0.0

  # Permisos en tiempo de ejecución
  permission_handler: ^12.0.1

  # Sensores y GPS
  sensors_plus: ^6.1.1
  pedometer: ^4.1.1
  geolocator: ^14.0.2

  # Mapa sin API key (OpenStreetMap) y gráficas
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  fl_chart: ^0.70.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Ilustraciones estilo anime (mascota de la app)
  assets:
    - assets/images/

  # Tipografía redondeada de estilo japonés (M PLUS Rounded 1c, licencia OFL)
  fonts:
    - family: MPlusRounded
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-Regular.ttf
          weight: 400
        - asset: assets/fonts/MPLUSRounded1c-Medium.ttf
          weight: 500
        - asset: assets/fonts/MPLUSRounded1c-Bold.ttf
          weight: 700
        - asset: assets/fonts/MPLUSRounded1c-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/MPLUSRounded1c-Black.ttf
          weight: 900
